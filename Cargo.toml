[package]
name = "glmeter"
version = "0.2.3"
edition = "2021"
description = "GLM Coding Plan quota tray monitor (5-hour window & reset time)"
license = "MIT"
repository = "https://github.com/crazykun/GLMeter"
rust-version = "1.89"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

# Linux: StatusNotifierItem 纯 Rust 实现（悬停 Title/ToolTip、自定义托盘文字）
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# Windows/macOS: 原生托盘
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.24"
tao = "0.37"

# exe 图标资源嵌入（build.rs 仅在 Windows 目标时实际生效）
[build-dependencies]
winresource = "0.1"

# cargo deb 打包配置：安装二进制 + .desktop 启动器入口 + hicolor 图标
[package.metadata.deb]
maintainer = "crazykun"
copyright = "2026, crazykun"
license-file = ["LICENSE", "0"]
depends = "$auto"
section = "utility"
priority = "optional"
extended-description-file = "README.md"
assets = [
    ["target/release/glmeter", "usr/bin/", "755"],
    ["packaging/glmeter.desktop", "usr/share/applications/", "644"],
    ["assets/icon32.png", "usr/share/icons/hicolor/32x32/apps/glmeter.png", "644"],
    ["assets/icon128.png", "usr/share/icons/hicolor/128x128/apps/glmeter.png", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/glmeter.png", "644"],
    ["README.md", "usr/share/doc/glmeter/README.md", "644"],
    ["LICENSE", "usr/share/doc/glmeter/LICENSE", "644"],
]

[profile.release]
strip = true
lto = true
codegen-units = 1
