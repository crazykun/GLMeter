[package]
name = "glmeter"
version = "0.1.1"
edition = "2021"
description = "GLM Coding Plan quota tray monitor (5-hour window & reset time)"
license = "MIT"
repository = "https://github.com/crazykun/GLMeter"
rust-version = "1.89"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

# Linux: StatusNotifierItem 纯 Rust 实现（悬停 Title/ToolTip、自定义托盘文字）
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# Windows/macOS: 原生托盘
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.24"
tao = "0.37"

[profile.release]
strip = true
lto = true
codegen-units = 1
